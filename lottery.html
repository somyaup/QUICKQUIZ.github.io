<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Congrats!</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div class="container">
      <div id="end" class="flex-center flex-column">
         <h1 >You earned INR</h1>
        <h1 id="finalScore"></h1>
        <h2 id="participation">(Excluding Participation Fee)</h2>
        <hr style="width: 60%; margin: 30px 0;" />

  <h2 style="font-size: 2.8rem;">Lottery Decision</h2>

  <div id="lotterySection" style="font-size: 1.8rem;">
    <label>
      <input type="radio" name="lottery" value="A" >
      Option A: Sure payoff of ₹10
    </label>

    <label>
      <input type="radio" name="lottery" value="B">
      Option B: ₹20 if Head and ₹0 if Tail
    </label>
  </div>

  <button id="resolveLotteryBtn" class="btn">
    Confirm Lottery Choice
  </button>

  <div id="lotteryResult"></div>

        <p class ="btn">Thank You!</p>
        <!-- <a class="btn" href="gameT1A.html">Play a new set for 2X?</a>
        <a class="btn" href="gameT1B.html">Continue for 15 minutes?</a> -->
      </div>
    </div>
    <script>/* ---------- CONFIG ---------- */

const WEB_APP_URL =  "https://script.google.com/macros/s/AKfycbzxbYdLXmzDRbFlPtyYt2n0_UCekRvw9byUyKHsPPbdcjtbIJDNjxJNgiuXIo3aOvNtSA/exec";

const finalScoreElement = document.getElementById("finalScore");
const resolveBtn = document.getElementById("resolveLotteryBtn");
const lotteryResultDiv = document.getElementById("lotteryResult");
const playerName = localStorage.getItem("playerName");
const playerNumber = localStorage.getItem("playerNumber");
const baseScore = Number(localStorage.getItem("mostRecentScore")) || 0;
let lotteryChoice = null;
let lotteryPayoff = 0;
let flipResult = null;

/* ---------- DISPLAY BASE SCORE ---------- */
finalScoreElement.innerText = baseScore;

/* ---------- ENABLE BUTTON WHEN RADIO SELECTED ---------- */

document.querySelectorAll('input[name="lottery"]').forEach(radio => {
  radio.addEventListener("change", () => {
    lotteryChoice = radio.value;
    resolveBtn.disabled = false;
  });
});

/* ---------- LOTTERY RESOLUTION ---------- */

function resolveLottery(choice) {
  if (choice === "A") return 10;

  if (choice === "B") {
    flipResult = Math.random() < 0.5 ? "Head" : "Tail";
    return flipResult === "Head" ? 20 : 0;
  }

  return 0;
}

/* ---------- CONFIRM BUTTON ---------- */

resolveBtn.addEventListener("click", () => {

  lotteryPayoff = resolveLottery(lotteryChoice);

  const totalEarnings = baseScore + lotteryPayoff;

  finalScoreElement.innerText = totalEarnings;

  if (lotteryChoice === "A") {
    lotteryResultDiv.innerHTML =
      `<p>You chose the sure option and earned ₹10.</p>`;
  }

  if (lotteryChoice === "B") {
    lotteryResultDiv.innerHTML =
      `<p>Coin flip: ${flipResult} → You earned ₹${lotteryPayoff}</p>`;
  }

  resolveBtn.disabled = true;

  /* ---------- PREPARE DATA ---------- */

  let gameLog = {
  playerNumber: playerNumber+"Lottery",
  playerName: playerName,
  total: totalEarnings,
  results: []
};

  gameLog.results.push({
    lotteryChoice:lotteryChoice,
    lotteryOutcome: lotteryPayoff
  });

  /* ---------- SEND TO SHEET ---------- */

  fetch(WEB_APP_URL, {
    method: "POST",
    body: JSON.stringify(gameLog)
  })
  .catch(err => {
    alert(err);
    console.error(err);
  });
});
</script>
    <script src="end.js"></script>
  </body>
</html>
